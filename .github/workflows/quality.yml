name: Quality gates - not automatic deployment

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27018/sa_test?replicaSet=rs0&directConnection=true
      NEXT_PUBLIC_API_URL: /api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check runtime policy and package consistency
        run: |
          npm run check:runtime
          npm run test:runtime

      - name: Free runner disk space for MongoDB integration tests
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Disk before cleanup ==="
          df -h

          # GitHub ubuntu-latest contains large SDK/tool installations that
          # Singh Academy does not use. MongoDB refuses index creation when
          # free disk falls below its safety threshold.
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          echo "=== Disk after cleanup ==="
          df -h

          AVAILABLE_KB="$(df --output=avail / | tail -1 | tr -d ' ')"
          REQUIRED_KB=$((2 * 1024 * 1024))

          if [ "$AVAILABLE_KB" -lt "$REQUIRED_KB" ]; then
            echo "::error::Less than 2 GiB free disk is available for the MongoDB integration suite."
            exit 1
          fi

      - name: Install dependencies without hiding lockfile problems
        shell: bash
        run: |
          set -euo pipefail

          for dir in backend frontend; do
            if [ -f "$dir/package-lock.json" ]; then
              npm ci --prefix "$dir"
            else
              echo "$dir/package-lock.json is not committed yet; generating it for this verification run."
              npm install --prefix "$dir" --package-lock-only --ignore-scripts --no-audit --no-fund
              npm ci --prefix "$dir"
            fi
          done

      - name: Source, unit, types, production build and dependency audit
        run: npm run verify

      - name: Start isolated test replica set
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Disk before MongoDB ==="
          df -h

          docker compose -f dev/test-mongo-compose.yml up -d --wait

          docker compose -f dev/test-mongo-compose.yml exec -T mongo \
            mongosh --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"

          for i in $(seq 1 45); do
            if docker compose -f dev/test-mongo-compose.yml exec -T mongo \
              mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(2)'; then
              break
            fi
            sleep 2
          done

          docker compose -f dev/test-mongo-compose.yml exec -T mongo \
            mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(2)'

      - name: Real HTTP and transaction tests
        run: npm run test:integration --prefix backend

      - name: Install browser and run actual frontend checks
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Actual UI reliability fixtures (isolated local API, no provider or SMTP calls)
        run: npm run test:ui

      - name: Stop test services
        if: always()
        run: docker compose -f dev/test-mongo-compose.yml down -v --remove-orphans